[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screening"
version = "0.1.0"
description = "Rakathon 2026 / VZP: predicting non-attendance at mammography screening"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "flaml[automl]",
    "optuna",
    "mlflow",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter", "matplotlib", "python-pptx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end pipeline run (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
extend-exclude = ["ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
# prose: slide texts and report templates
"scripts/build_deck.py" = ["E501"]
"notebooks/*" = ["E501"]
"src/screening/evaluation/real_data.py" = ["E501"]  # chart captions
