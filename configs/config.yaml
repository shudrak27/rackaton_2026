# Shared pipeline configuration. When real VZP data arrives, update `data.path`
# and `columns` first (mapping source column names to canonical names).

seed: 42

data:
  path: data/raw/synthetic.parquet      # CSV or Parquet
  # Extraction date: exclude invitations whose outcome window has not closed.
  # null currently disables this filter; set the extraction date for real data.
  cutoff_date: null
  outcome_window_months: 12

# Source column name: canonical column name; see src/screening/data/schema.py.
# Empty mapping preserves names: synthetic data already uses the canonical schema.
columns: {}

features:
  # Exclude model inputs such as target leakage, identifiers and post-invitation dates.
  exclude: []
  # `profile` flags individual features above this AUC threshold as leakage suspects.
  leakage_auc_warn: 0.95

split:
  test_year: 2024        # Out-of-time test; train on years < test_year
  n_folds: 5             # GroupKFold by client_id within the training set

flaml:
  enabled: true
  time_budget: 300       # Seconds
  metric: roc_auc
  estimator_list: [lgbm, xgboost, rf, extra_tree, lrl1]

optuna:
  n_trials: 50
  timeout: null          # Seconds; null means no timeout
  metric: roc_auc        # roc_auc | average_precision | neg_log_loss
  early_stopping_rounds: 50
  max_estimators: 3000
  # Tune and select the champion on a random client subset, retaining all their rows.
  # Final fitting uses the full training set. null = all; try ~100000 for 1.3M rows.
  tune_sample_clients: null

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: vzp-screening-nonattendance

evaluation:
  top_k: [0.05, 0.10, 0.20, 0.30]   # Highest-risk fractions for outreach budgets

segments:
  repeated_min_invitations: 3       # Repeated nonresponders
  lapsed_min_screenings_5y: 2       # Previously regular, now overdue
  lapsed_min_months: 24
  care_min_contacts: 6              # Healthcare use without prevention
  low_contact_max_contacts: 1       # Little contact with healthcare

experiment:
  alpha: 0.05
  power: 0.80
  mde_pp: [1.0, 2.0, 3.0, 5.0]      # Minimum detectable attendance uplift, percentage points

paths:
  reports: reports
  models: models

# ASSUMPTION: all costs and effects below are placeholders; replace after A/B testing.
# uplift_pp is absolute ATTENDANCE uplift in percentage points, not relative percent.
interventions:
  sms:
    cost_czk: 2.0
    uplift_pp:
      first_invitation: 1.0
      repeated_nonresponder: 0.5
      lapsed_regular: 3.0
      care_no_prevention: 1.0
      low_contact: 0.5
      other: 1.0
  call:
    cost_czk: 100.0
    uplift_pp:
      repeated_nonresponder: 3.0
      lapsed_regular: 5.0
      care_no_prevention: 4.0
      low_contact: 2.0
      other: 2.0
  physician:
    cost_czk: 150.0
    uplift_pp:
      care_no_prevention: 6.0

fairness:
  group_columns: [region, age_band]
  top_k: 0.20
